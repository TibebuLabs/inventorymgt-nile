# Render Blueprint Configuration
# This file tells Render how to build and deploy both backend and frontend.
# To use: Go to Render Dashboard -> New -> Blueprint -> Connect this repo.

services:
  # ── Backend API (NestJS) ─────────────────────────────────────────────
  - type: web
    name: nile-store-backend
    runtime: node
    rootDir: store-backend
    buildCommand: npm ci --omit=dev && npm run build && npx prisma generate && node prisma/apply-schema.js
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://inventorymgt-nile-frontend.onrender.com
      - key: DISABLE_SWAGGER
        value: "true"

  # ── Frontend (React + Vite) ──────────────────────────────────────────
  # IMPORTANT: This MUST be type: static_site, NOT web!
  # Static sites don't need a startCommand and serve pre-built files only.
  - type: static_site
    name: nile-store-frontend
    rootDir: store-frontend/Store_managmet_sms-main
    buildCommand: npm ci && npm run build
    publishPath: dist
    routes:
      - path: /*
        destination: /index.html
