services:
  # ── Backend API (NestJS) ─────────────────────────────────────────────
  - type: web
    name: nile-store-backend
    runtime: node
    rootDir: store-backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # ── Frontend (React + Vite) ──────────────────────────────────────────
  - type: web
    name: nile-store-frontend
    runtime: static
    rootDir: store-frontend/Store_managmet_sms-main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nile-store-backend.onrender.com/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
