# Render Blueprint Configuration
# This file tells Render how to build and deploy both backend and frontend.
# To use: Go to Render Dashboard -> New -> Blueprint -> Connect this repo.

services:
  # ── Backend API (NestJS) ─────────────────────────────────────────────
  - type: web
    name: nile-store-backend
    runtime: node
    rootDir: store-backend
    buildCommand: npm ci --omit=dev && npm run build && npx prisma generate && node prisma/apply-schema.js
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nile-store-frontend.onrender.com
      - key: DISABLE_SWAGGER
        value: "true"

  # ── Frontend (React + Vite) ──────────────────────────────────────────
  - type: web
    name: nile-store-frontend
    runtime: static
    rootDir: store-frontend/Store_managmet_sms-main
    buildCommand: npm install && npm run build
    publicPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nile-store-backend.onrender.com/
    routes:
      - type: rewrite
        source: ^(?!.*\.).*$
        destination: /index.html
